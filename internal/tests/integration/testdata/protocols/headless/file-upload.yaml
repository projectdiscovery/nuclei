id: file-upload

info:
  name: Basic File Upload
  author: pdteam
  severity: info

headless:
  - steps:
    - action: navigate
      args:
        url: "{{BaseURL}}"
    - action: waitload
    - action: files
      args:
        by: xpath
        xpath: /html/body/form/input[1]
        value: protocols/headless/file-upload.yaml
    - action: sleep
      args:
        duration: 2
    - action: click
      args:
        by: x
        xpath: /html/body/form/input[2]
    # the upload response echoes the file, rendered as text in a pre element
    - action: waitvisible
      args:
        by: xpath
        xpath: //pre[contains(., "Basic File Upload")]
    matchers:
      - type: word
        words:
          - "Basic File Upload"